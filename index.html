function errorMessage(e){if(e?.message?.includes('Failed to fetch'))return 'เชื่อมต่อไม่ได้ กรุณาตรวจอินเทอร์เน็ตและการตั้งค่า Supabase';return e?.message||String(e);}
async function checked(promise){const {data,error}=await promise;if(error)throw error;return data;}
async function command(op,payload,requestId){const key=op+JSON.stringify(payload);const id=requestId||pendingCommands.get(key)||crypto.randomUUID();pendingCommands.set(key,id);try{const result=await checked(db.rpc('bpm_command',{op,payload,request_id:id}));pendingCommands.delete(key);return result;}catch(e){if(e.code)pendingCommands.delete(key);throw e;}}
async function runButton(button,job){if(button.disabled)return;const text=button.textContent;button.disabled=true;button.textContent='กำลังดำเนินการ…';try{await job();}catch(e){toast(errorMessage(e));}finally{if(button.isConnected){button.disabled=false;button.textContent=text;}}}
function logo(){return settings.logo_path?db.storage.from('bpm-branding').getPublicUrl(settings.logo_path).data.publicUrl:'';}
function logoImg(){return logo()?`<img src="${esc(logo())}" alt="ตราโรงเรียน" data-image-fallback>`:'<span aria-label="โรงเรียน" style="font-size:30px">🏫</span>';}
async function askPassword(){const d=document.getElementById('passwordDialog');d.returnValue='no';d.querySelector('input').value='';d.showModal();return new Promise(resolve=>d.addEventListener('close',()=>{const v=d.returnValue==='yes'?d.querySelector('input').value:null;d.querySelector('input').value='';resolve(v);},{once:true}));}
async function confirmAction(message){const d=document.getElementById('confirm');d.querySelector('p').textContent=message;d.returnValue='no';d.showModal();return new Promise(resolve=>d.addEventListener('close',()=>resolve(d.returnValue==='yes'),{once:true}));}

 root.innerHTML=`<div class="login-screen"><div class="login-card">${logoImg()}<h1>${esc(settings.school_name)}</h1><div class="muted">${esc(settings.affiliation)}<br>ระบบส่งแผนการจัดการเรียนรู้</div>${message?`<p class="notice error">${esc(message)}</p>`:''}<form id="loginForm">${field('ชื่อผู้ใช้งาน','username','','text',true)}${field('รหัสผ่าน','password','','password',true)}<button class="btn" type="submit">เข้าสู่ระบบ</button><div id="loginError" role="alert"></div></form><div class="login-foot">ระบบส่ง ตรวจ อนุมัติ และจัดเก็บแผน<br>BanPanMor SPA 1.0</div></div></div>`;
 const form=document.getElementById('loginForm');form.username.autocomplete='username';form.password.autocomplete='current-password';
 form.onsubmit=e=>{e.preventDefault();runButton(form.querySelector('button'),async()=>{

  }catch(err){document.getElementById('loginError').innerHTML=`<p class="notice error">${esc(errorMessage(err))}</p>`;}finally{loginBusy=false;}
 });};
}
async function enterSession(){
 const session=await checked(db.auth.getSession());if(!session.session){loginScreen();return;}
 me=await checked(db.from('bpm_profiles').select('*').eq('id',session.session.user.id).single());

 sessionEpoch++;shell();const linked=new URLSearchParams(window.location.search).get('plan');if(linked&&/^[0-9a-f-]{36}$/i.test(linked)){route='archive';try{await detail(linked);}catch(e){toast(errorMessage(e));await navigate('archive');}}else await navigate('home');

async function navigate(name){
 if(!me||!REF.NAV_BY_ROLE[me.role].some(n=>n.id===name))return;
 charts.forEach(c=>c.destroy());charts=[];route=name;epoch++;const stamp=epoch;queryAbort?.abort();queryAbort=new AbortController();current=null;
 document.getElementById('menuPanel').hidden=true;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));
 const c=document.getElementById('content');c.innerHTML=loading();
 try{
  if(name==='home')await home(c,stamp);
  else if(name==='submit')await planForm(c,null,stamp);
  else if(['myplans','archive','review_sh','review_ac','approve','afterteach','at_review'].includes(name))await listPage(c,stamp);

}

function table(rows){if(!rows.length)return '<div class="empty">ยังไม่มีรายการตามเงื่อนไขที่เลือก</div>';return `<div class="table-wrap"><table><thead><tr><th>หน่วย / แผน</th><th>ครู / ชั้น</th><th>ภาคเรียน / ปี</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${esc(p.data.unit_name)}</b><small>แผนที่ ${esc(p.data.plan_no)} · ${esc(p.data.plan_topic)}</small></td><td>${esc(p.teacher_name)}<small>${esc(p.data.subject_group)} · ${esc(p.data.grade)}</small></td><td>${p.data.semester}/${p.data.year}<small>${MONTHS[p.data.month-1]||'ไม่ระบุเดือน'}</small></td><td>${badge(p.status)}${(Array.isArray(p.bpm_afterteach)?p.bpm_afterteach[0]:p.bpm_afterteach)?`<small>หลังสอน: ${AT_STATUS[(Array.isArray(p.bpm_afterteach)?p.bpm_afterteach[0]:p.bpm_afterteach).status]}</small>`:''}</td><td>${btn('เปิดรายการ','detail',p.id,'secondary small')}</td></tr>`).join('')}</tbody></table></div>`;}
async function listPage(c,stamp){const f=filters[route]||(filters[route]={});page=0;
 const title={myplans:'แผนของฉัน',archive:'คลังแผนการจัดการเรียนรู้',review_sh:'ตรวจและประเมิน — กลุ่มสาระ',review_ac:'ตรวจองค์ประกอบ — วิชาการ',approve:'พิจารณาอนุมัติ — ผู้อำนวยการ',afterteach:'บันทึกหลังการจัดการเรียนรู้',at_review:'พิจารณาบันทึกหลังสอน'}[route];
 c.innerHTML=`<div class="titlebar"><div><h1>${title}</h1><p class="muted">เลือกกลุ่มสาระ เดือน ภาคเรียน และปีการศึกษาที่ต้องการ</p></div>${btn('รีเฟรชรายการ','reloadList','','secondary')}</div><section class="card"><form id="filterForm"><div class="filters">${select('กลุ่มสาระ','subject_group',REF.SUBJECT_GROUPS,f.subject_group,true)}${select('เดือน','month',MONTHS.map((m,i)=>[i+1,m]),f.month,true)}${select('ภาคเรียน','semester',[1,2],f.semester,true)}${select('ปีการศึกษา','year',settings.years,f.year,true)}</div><div class="grid">${field('ค้นหาครู หน่วย เลขแผน ชั้น หรือเรื่อง','search',f.search)}${select('สถานะ','status',Object.entries(STATUS),f.status,true)}</div></form><div id="listResults">${loading()}</div><div class="row" style="margin-top:16px"><div>${btn('← ก่อนหน้า','prev','','secondary small')} ${btn('ถัดไป →','next','','secondary small')}</div><span id="pageInfo" class="muted"></span><label>แสดง <select id="perPage" style="width:auto">${options([20,50,100],perPage)}</select></label></div></section>`;

async function loadList(stamp=epoch){const seq=++listSeq,f=filters[route]||{};const box=document.getElementById('listResults');if(!box)return;box.innerHTML=loading();
 let q=db.from('bpm_plans').select('id,owner_id,teacher_name,data,status,version,updated_at,bpm_afterteach(status)',{count:'exact'});
 if(['myplans','afterteach'].includes(route))q=q.eq('owner_id',me.id);
 const queue={review_sh:'pending_subject',review_ac:'pending_academic',approve:'pending_director'}[route];if(queue)q=q.eq('status',queue);
 for(const k of ['subject_group','month','year','semester'])if(f[k])q=q.eq(`data->>${k}`,f[k]);
 if(f.status)q=q.eq('status',f.status);
 const s=String(f.search||'').replace(/[(),.%_"\\]/g,' ').trim().slice(0,100);
 if(s)q=q.or(`teacher_name.ilike.%${s}%,data->>unit_name.ilike.%${s}%,data->>plan_no.ilike.%${s}%,data->>grade.ilike.%${s}%,data->>plan_topic.ilike.%${s}%`);
 if(route==='at_review')q=q.not('bpm_afterteach','is',null); // Inner join below is used for actual filtering.
 if(route==='at_review'){
  q=db.from('bpm_plans').select('id,owner_id,teacher_name,data,status,version,updated_at,bpm_afterteach!inner(status)',{count:'exact'});
  for(const k of ['subject_group','month','year','semester'])if(f[k])q=q.eq(`data->>${k}`,f[k]);
  if(f.status)q=q.eq('status',f.status);if(s)q=q.or(`teacher_name.ilike.%${s}%,data->>unit_name.ilike.%${s}%,data->>plan_topic.ilike.%${s}%`);
 }
 const res=await q.order('updated_at',{ascending:false}).order('id').range(page*perPage,(page+1)*perPage-1).abortSignal(queryAbort.signal);
 if(seq!==listSeq||stamp!==epoch)return;if(res.error)throw res.error;
 box.innerHTML=table(res.data);document.getElementById('pageInfo').textContent=`หน้า ${page+1} · ${res.count||0} รายการ`;
 document.querySelector('[data-action="prev"]').disabled=page===0;document.querySelector('[data-action="next"]').disabled=(page+1)*perPage>=res.count;
}

async function compressImage(file,max=1600){if(!['image/jpeg','image/png','image/webp'].includes(file.type))return file;const bitmap=await createImageBitmap(file);try{const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);const blob=await new Promise(r=>canvas.toBlob(r,'image/webp',.88));return blob&&blob.size<file.size?new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp'}):file;}finally{bitmap.close();}}

function summary(eval1,type){if(!eval1)return 'ยังไม่ประเมิน';if(type==='A'){const count=eval1.items.filter(Boolean).length;return `${count}/21 (${(count/21*100).toFixed(1)}%)`;}const s=eval1.scores;const avg=s.reduce((a,b)=>a+b,0)/s.length;const level=type==='B'?(avg>3?'ดีมาก':avg>2?'ดี':avg>1?'พอใช้':'ปรับปรุง'):(avg>=3.51?'ดีมาก':avg>=2.51?'ดี':avg>=1.51?'พอใช้':'ปรับปรุง');return `${avg.toFixed(2)} — ${level}`;}

function guidePage(c){c.innerHTML=`<div class="card"><h1>คู่มือการใช้งาน</h1><ol><li>ตั้งลายเซ็นในเมนูลายเซ็นของฉัน</li><li>ครูส่งแผนพร้อมบันทึกข้อความ องค์ประกอบ และแผนฉบับเต็ม</li><li>หัวหน้ากลุ่มสาระประเมิน B ทุกแผน และ C ครั้งเดียวต่อหน่วย</li><li>วิชาการตรวจ A 21 รายการ ครั้งเดียวต่อหน่วยฉบับที่มีผล</li><li>ผู้อำนวยการพิจารณาและลงนาม</li><li>ครูบันทึกผลหลังสอน วิชาการให้ความเห็น</li></ol><div class="notice">หากถูกส่งคืน กด “แก้ไขแผน” ในรายการเดิมได้ทันที การแก้แผนที่อนุมัติแล้วจะเริ่มการตรวจรอบใหม่และเก็บประวัติเดิมไว้</div><h3>การแนบเอกสารครั้งเดียวต่อหน่วย</h3><p>ระบบแยกหน่วยตามครู ชั้น กลุ่มสาระ ปีการศึกษา และภาคเรียน การเปลี่ยนบันทึกข้อความหรือองค์ประกอบทำให้เกิดฉบับหน่วยใหม่ ผลตรวจเดิมไม่รับรองฉบับที่เปลี่ยนแล้ว</p><h3>ข้อมูลเกณฑ์ประเมิน</h3><p>B มี 4 ดัชนี C มี 10 ข้อ และ A มี 21 รายการตามต้นฉบับ โรงเรียนต้องจัดหาเอกสารเกณฑ์ย่อย B หากต้องการรายละเอียด “ครบ 5 ข้อ” เพิ่มเติม</p></div>`;}
async function history(p){const rows=await checked(db.from('bpm_history').select('id,action,created_at,snapshot').eq('plan_id',p.id).order('id',{ascending:false}).limit(50));document.getElementById('historyArea').innerHTML=`<div class="card"><h2>ประวัติล่าสุด (ไม่เกิน 50 รายการ)</h2>${rows.map(r=>`<details class="file-row"><summary>${esc(r.action)} · ${new Date(r.created_at).toLocaleString('th-TH')}</summary><pre>${esc(JSON.stringify(r.snapshot,null,2))}</pre></details>`).join('')||'<p class="hint">ยังไม่มีประวัติการแก้ไข</p>'}</div>`;}
async function preparePrint(p,after=false){const w=window.open('about:blank','_blank');if(!w)throw Error('กรุณาอนุญาตหน้าต่างใหม่เพื่อพิมพ์');w.document.body.textContent='กำลังเตรียมเอกสาร…';try{const u=p.unit,a=p.after;const ids=[p.teacher_signature_id,p.eval_b?.signature_id,u.eval_c?.signature_id,u.eval_a?.signature_id,u.approval?.signature_id,a?.signature_id,a?.opinion?.signature_id].filter(Boolean);const sigs={};await Promise.all([...new Set(ids)].map(async id=>sigs[id]=(await fileUrl(id)).url));
 const adapt=(ev,type)=>!ev?null:{evaluator:ev.name,evaluator_username:ev.signature_id,...(type==='A'?{count:ev.items.filter(Boolean).length,total:21,pct:(ev.items.filter(Boolean).length/21*100).toFixed(1)+'%'}:{avg:(ev.scores.reduce((a,b)=>a+b,0)/ev.scores.length).toFixed(2),level:summary(ev,type).split(' — ')[1]})};

 const legacy={...p.data,plan_id:p.id,status:STATUS[p.status],teacher_name:p.teacher_name,teacher_username:after?a?.signature_id:p.teacher_signature_id,files:files.filter(Boolean),evalB:adapt(p.eval_b,'B'),evalC:adapt(u.eval_c,'C'),evalA:adapt(u.eval_a,'A'),approval:u.approval?{director_username:u.approval.signature_id,director_name:u.approval.name,decision:u.approval.approved?'อนุมัติ':'ไม่อนุมัติ'}:null,afterTeach:at};
 ARCHIVE_CACHE[p.id]=AT_CACHE[p.id]=legacy;ARCHIVE_SIGNATURES=AT_SIGNATURES=sigs;if(after)openPrintAfterTeach(p.id,w);else openPrintView(p.id,w);
 // Branding is configurable, while the original document layout is retained.
 w.document.title=w.document.title+' · ฉบับ '+p.version;w.document.querySelectorAll('.school').forEach(e=>e.textContent=settings.school_name);
 w.document.querySelectorAll('div').forEach(e=>{if(e.children.length===0&&e.textContent==='โรงเรียนบ้านปั้นหม้อ')e.textContent=settings.school_name;if(e.children.length===0&&e.textContent==='สำนักงานเขตพื้นที่การศึกษาประถมศึกษาจันทบุรี เขต 2')e.textContent=settings.affiliation;});
 const sub=w.document.querySelector('.doc-head .sub');if(sub)sub.textContent=settings.affiliation;
 const note=w.document.createElement('div');note.textContent='รหัสแผน '+p.id+' · ฉบับ '+p.version+(after&&a?` · บันทึกหลังสอนอ้างอิงฉบับ ${a.plan_version}`:'');note.style.cssText='font-size:10px;color:#888;margin-top:20px';w.document.body.append(note);
 }catch(e){w.close();throw e;}}
root.addEventListener('click',async e=>{const nav=e.target.closest('[data-nav]');if(nav){await navigate(nav.dataset.nav);return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='menu'){document.getElementById('menuPanel').hidden=!document.getElementById('menuPanel').hidden;return;}
 if(a==='logout'){try{if(await confirmAction('ต้องการออกจากระบบหรือไม่?')){await checked(db.auth.signOut());clearSession();loginScreen();}}catch(e){toast(errorMessage(e));}return;}
 await runButton(b,async()=>{
  if(a==='new')await navigate('submit');else if(a==='work')await navigate(REF.NAV_BY_ROLE[me.role][1].id);else if(a==='archive')await navigate('archive');else if(a==='refresh')await navigate(route);else if(a==='back')await navigate(route==='submit'?'myplans':route);
  else if(a==='detail')await detail(id);else if(a==='edit'){const p=await getDetail(id);await planForm(document.getElementById('content'),p,++epoch);}
  else if(a==='delete'){if(await confirmAction('ลบแผนนี้ออกจากรายการหรือไม่? ระบบจะเก็บประวัติและไฟล์เดิมไว้')){await command('plan.delete',{id,version:current.version});toast('ลบแผนแล้ว');await navigate('myplans');}}
  else if(a==='file')await openFile(id);else if(a==='after')await afterForm(current);else if(a==='print'||a==='printAfter')await preparePrint(current,a==='printAfter');else if(a==='history')await history(current);
  else if(a==='prev'||a==='next'||a==='reloadList'){if(a==='prev')page=Math.max(0,page-1);if(a==='next')page++;await loadList();}
  else if(a==='rename'){const username=prompt('ชื่อผู้ใช้ใหม่ (อังกฤษ/ตัวเลข)');if(username){await edge({action:'rename',id,username});toast('เปลี่ยนชื่อผู้ใช้แล้ว');await navigate('users');}}
  else if(a==='adminSig'){const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp';input.onchange=async()=>{try{if(input.files[0]){const f=await upload(input.files[0],'signature');await edge({action:'signature',id,file_id:f.id});toast('บันทึกลายเซ็นแทนสำเร็จ');}}catch(e){toast(errorMessage(e));}};input.click();}
  else if(a==='password'){const password=await askPassword();if(password){await edge({action:'password',id,password});toast('ตั้งรหัสผ่านใหม่แล้ว');}}
 });
